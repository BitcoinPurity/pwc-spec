[package]
name = "pwc-client"
version = "0.1.0"
edition = "2021"
description = "PWC Client: Core v0.2.1 over the LOCAL transport v0.1.0"
publish = false

[dependencies]
getrandom = "0.2"
hmac = "0.12"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }

[dev-dependencies]
jsonschema = { version = "0.30", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
