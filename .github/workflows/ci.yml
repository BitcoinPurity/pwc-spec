name: CI

# Runs on every push to any branch, which covers pull requests from branches of this repository.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec:
    name: Specification checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Uses the agent's own python3, which needs the venv module (python3-venv on Debian). The virtual environment
      # avoids installing into an externally managed system Python. actions/setup-python is not used because it
      # needs a GitHub workflow token, and token requests for this pipeline are rejected.
      - run: python3 -m venv .venv && .venv/bin/python -m pip install jsonschema referencing
      - run: .venv/bin/python pwc-schema/check_schema.py specs/PWC-Core-v0.2.1-EN.md specs/PWC-Transport-Local-v0.1.0-EN.md specs/PWC-Transport-Remote-v0.1.0-EN.md
      - run: .venv/bin/python pwc-testkit/run_vectors.py
      - run: .venv/bin/python pwc-testkit/check_family.py specs

  # Every use of Swatinem/rust-cache sets cache-bin to "false", so that it leaves ~/.cargo/bin alone: the agents
  # share that directory, and with the default the save step removes programs from it.
  provider:
    name: Rust Provider
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwc-provider
    steps:
      - uses: actions/checkout@v4
      # A private CARGO_HOME per job: jobs on one agent share the home directory, and rustup-init of one job rewrote
      # ~/.cargo/bin while another job ran rustc from it ("Text file busy", build 35).
      - run: echo "CARGO_HOME=$GITHUB_WORKSPACE/.cargo-home" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pwc-provider
          cache-bin: "false"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # The tests include tests/runner.rs, which runs pwc-testkit/local_runner.py with the runner's python3.
      - run: cargo test --locked

  client:
    name: Rust Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwc-client
    steps:
      - uses: actions/checkout@v4
      # A private CARGO_HOME, as in the provider job.
      - run: echo "CARGO_HOME=$GITHUB_WORKSPACE/.cargo-home" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      # One step that does not depend on ~/.cargo, which the agents share. Jobs running at the same time, also
      # those of other builds, reinstall rustup there and clean it, and a later step of this job then failed
      # with "cargo: command not found". The toolchain's own programs are used instead of the rustup proxies,
      # with a private CARGO_HOME, and without Swatinem/rust-cache.
      # The tests include tests/provider.rs, which runs the library against pwc-provider, and
      # tests/mock_provider.rs, which runs pwc-testkit/mock_local_provider.py with the runner's python3.
      - run: |
          toolchain="${RUSTUP_HOME:-$HOME/.rustup}/toolchains/1.97.0-$(uname -m)-unknown-linux-gnu/bin"
          test -x "$toolchain/cargo"
          export PATH="$toolchain:$PATH"
          export CARGO_HOME="$(mktemp -d)"
          trap 'rm -rf "$CARGO_HOME"' EXIT
          echo "cargo: $(command -v cargo)"
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          # The feature that exports the interface through UniFFI; pwc-client-ffi builds the bindings.
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --locked
          cargo test --locked --all-features

  client-ffi:
    name: Client bindings
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwc-client-ffi
    steps:
      - uses: actions/checkout@v4
      # A private CARGO_HOME, as in the provider job.
      - run: echo "CARGO_HOME=$GITHUB_WORKSPACE/.cargo-home" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      # One step with the toolchain's own programs and a private CARGO_HOME, as in the client job.
      # tests/python.rs generates the Python module and runs tests/test_bindings.py with the runner's python3.
      - run: |
          toolchain="${RUSTUP_HOME:-$HOME/.rustup}/toolchains/1.97.0-$(uname -m)-unknown-linux-gnu/bin"
          test -x "$toolchain/cargo"
          export PATH="$toolchain:$PATH"
          export CARGO_HOME="$(mktemp -d)"
          trap 'rm -rf "$CARGO_HOME"' EXIT
          echo "cargo: $(command -v cargo)"
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwc-provider
    steps:
      - uses: actions/checkout@v4
      # A private CARGO_HOME, as in the provider job.
      - run: echo "CARGO_HOME=$GITHUB_WORKSPACE/.cargo-home" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pwc-provider
          cache-bin: "false"
      # Built in the job's own directory. By default cargo install builds under the temporary directory, which the
      # agents share, and a build there lost its files while it ran.
      - run: cargo install cargo-llvm-cov --version 0.9.2 --locked --target-dir target/cargo-llvm-cov-install
      - run: cargo llvm-cov --locked --no-report
      # Reported only; coverage does not fail the build.
      - run: |
          cargo llvm-cov report --summary-only | tee coverage.txt
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            { echo "## Coverage of pwc-provider"; echo; echo '```text'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  provider-windows:
    name: Rust Provider (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pwc-provider
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          components: clippy
      - run: cargo clippy --all-targets --locked -- -D warnings
      # The named pipe tests run here; tests/runner.rs, which needs AF_UNIX, is compiled out.
      - run: cargo test --locked

  java-sdk:
    name: Java Provider SDK (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: macos-aarch64
            runner: macos-latest
          - platform: windows-x86_64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: pwc-provider-java
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # A private CARGO_HOME, as in the provider job.
      - if: runner.os != 'Windows'
        run: echo "CARGO_HOME=$GITHUB_WORKSPACE/.cargo-home" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      # Builds and tests on this platform; see the script for the JDK and $CARGO.
      - run: ci/build.sh ${{ matrix.platform }}
      # The Buildkite GitHub Actions runner gives run steps no agent token, so artifacts go through the actions.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: pwc-provider-java/natives/${{ matrix.platform }}/
          if-no-files-found: error

  java-sdk-jar:
    name: Java Provider SDK jar
    needs: java-sdk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwc-provider-java
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # One download per platform into natives/<platform>/: the runner's adapter merges pattern downloads into
      # one directory, which would lose the platform directories.
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: pwc-provider-java/natives/linux-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: linux-aarch64
          path: pwc-provider-java/natives/linux-aarch64
      - uses: actions/download-artifact@v4
        with:
          name: macos-aarch64
          path: pwc-provider-java/natives/macos-aarch64
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: pwc-provider-java/natives/windows-x86_64
      # One jar with the native libraries of the four platforms.
      - run: ci/assemble.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pwc-provider-java-jar
          path: pwc-provider-java/build/libs/*.jar
          if-no-files-found: error

  # A job of its own: the runner's adapter resolves every secret a job references before the job starts, even in
  # steps that would be skipped, so the secret is referenced only by a job that runs on tags.
  java-sdk-publish:
    name: Publish the Java Provider SDK
    # The runner's adapter finds artifacts only in the jobs a job directly needs; the libraries come from java-sdk.
    needs: [java-sdk, java-sdk-jar]
    if: startsWith(github.ref, 'refs/tags/pwc-provider-java-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwc-provider-java
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # One download per platform into natives/<platform>/: the runner's adapter merges pattern downloads into
      # one directory, which would lose the platform directories.
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: pwc-provider-java/natives/linux-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: linux-aarch64
          path: pwc-provider-java/natives/linux-aarch64
      - uses: actions/download-artifact@v4
        with:
          name: macos-aarch64
          path: pwc-provider-java/natives/macos-aarch64
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: pwc-provider-java/natives/windows-x86_64
      - env:
          PWC_PACKAGES_USER: ${{ github.actor }}
          PWC_PACKAGES_TOKEN: ${{ secrets.PWC_PACKAGES_TOKEN }}
        run: ci/assemble.sh --publish "${{ github.ref_name }}"
