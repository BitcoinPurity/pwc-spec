[package]
name = "pwc-provider"
version = "0.1.0"
edition = "2021"
description = "PWC Provider: Core v0.2.1 over the LOCAL transport v0.1.0"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
bitcoin = { version = ">=0.32.8, <0.32.100", features = ["serde", "secp-recovery", "rand-std"] }
getrandom = "0.2"
libc = "0.2"
miniscript = "13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "io-std", "sync", "time", "macros", "signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
jsonschema = { version = "0.30", default-features = false }
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }
